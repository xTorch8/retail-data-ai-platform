  - name: FACT_CUSTOMER_LIFETIME_VALUE
    description: The table contains records of customer lifetime value metrics and behavioral segmentation data. Each record captures a single customer's purchasing history and value, including order history, financial contribution, profitability, and recency, frequency, and monetary (RFM) scores used for segmentation.
    base_table:
      database: RETAIL_ANALYTICS
      schema: GOLD
      table: FACT_CUSTOMER_LIFETIME_VALUE
    dimensions:
      - name: CUSTOMER_KEY
        description: Surrogate key uniquely identifying a customer.
        expr: CUSTOMER_KEY
        data_type: NUMBER(38,0)
        access_modifier: public_access
        sample_values:
          - '4'
          - '10'
          - '1'
      - name: CUSTOMER_LIFESPAN_DAYS
        description: The number of days representing the duration of a customer's active lifespan.
        expr: CUSTOMER_LIFESPAN_DAYS
        data_type: NUMBER(9,0)
        access_modifier: public_access
        sample_values:
          - '14'
          - '5'
          - '0'
      - name: FREQUENCY
        description: The number of times a customer has made a purchase.
        expr: FREQUENCY
        data_type: NUMBER(18,0)
        access_modifier: public_access
        sample_values:
          - '3'
          - '1'
          - '2'
      - name: FREQUENCY_SCORE
        description: A score representing how frequently a customer makes purchases.
        expr: FREQUENCY_SCORE
        data_type: NUMBER(1,0)
        access_modifier: public_access
        sample_values:
          - '2'
          - '1'
      - name: LIFETIME_ORDER_COUNT
        description: The total number of orders placed by a customer over their lifetime.
        expr: LIFETIME_ORDER_COUNT
        data_type: NUMBER(18,0)
        access_modifier: public_access
