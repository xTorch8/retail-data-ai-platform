name: SV_RETAIL_ANALYTICS
tables:
  - name: DIM_CUSTOMER
    description: The table contains records of customers, including their personal contact information and geographic location. Each record captures the validity period of the customer data, supporting historical tracking of customer attributes over time.
    base_table:
      database: RETAIL_ANALYTICS
      schema: GOLD
      table: DIM_CUSTOMER
    dimensions:
      - name: CITY
        description: The city associated with the customer's location.
        expr: CITY
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - Jakarta
          - Bandung
          - Surabaya
      - name: COUNTRY
        description: The country associated with the customer.
        expr: COUNTRY
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - INDONESIA
      - name: CUSTOMER_BUSINESS_KEY
        description: The unique business identifier assigned to each customer.
        expr: CUSTOMER_BUSINESS_KEY
        data_type: NUMBER(38,0)
        access_modifier: public_access
        sample_values:
          - '7'
          - '3'
          - '1'
      - name: CUSTOMER_KEY
        description: Surrogate key uniquely identifying each customer record.
        expr: CUSTOMER_KEY
        data_type: NUMBER(38,0)
        access_modifier: public_access
        sample_values:
          - '3'
          - '1'
          - '2'
      - name: EMAIL
        description: The email address associated with the customer.
        expr: EMAIL
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - andi.pratama@example.com
          - gita.permata@example.com
          - budi.santoso@example.com
      - name: FIRST_NAME
        description: The first name of the customer.
        expr: FIRST_NAME
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - Andi
          - Budi
          - Hendra
      - name: FULL_NAME
        description: The full name of the customer.
        expr: FULL_NAME
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - Andi Pratama
          - Citra Lestari
          - Budi Santoso
      - name: IS_CURRENT
        description: Indicates whether the customer record is the current active version.
        expr: IS_CURRENT
        data_type: BOOLEAN
        access_modifier: public_access
        sample_values:
          - 'TRUE'
      - name: IS_VALID
        description: Indicates whether a customer record is considered valid.
        expr: IS_VALID
        data_type: BOOLEAN
        access_modifier: public_access
        sample_values:
          - 'TRUE'
      - name: LAST_NAME
        description: The last name of the customer.
        expr: LAST_NAME
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - Lestari
          - Hidayat
          - Pratama
      - name: PHONE
        description: Customer phone numbers.
        expr: PHONE
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - '081234567002'
          - '081234567006'
          - '081234567001'
    time_dimensions:
      - name: PROCESSED_AT
        description: The timestamp indicating when the customer record was processed.
        expr: PROCESSED_AT
        data_type: TIMESTAMP_LTZ(9)
        access_modifier: public_access
        sample_values:
          - 2026-08-15T11:52:57.303+0000
      - name: SOURCE_EXTRACTED_AT
        description: The timestamp indicating when the record was extracted from the source system.
        expr: SOURCE_EXTRACTED_AT
        data_type: TIMESTAMP_TZ(9)
        access_modifier: public_access
        sample_values:
          - '2026-08-15T11:27:29.842Z'
      - name: VALID_FROM
        description: The timestamp indicating the start of the period during which the customer record is considered valid.
        expr: VALID_FROM
        data_type: TIMESTAMP_LTZ(9)
        access_modifier: public_access
        sample_values:
          - 2026-08-15T11:52:57.303+0000
      - name: VALID_TO
        description: The timestamp indicating when a customer record's validity period ends.
        expr: VALID_TO
        data_type: TIMESTAMP_NTZ(9)
        access_modifier: public_access
    primary_key:
      columns:
        - CUSTOMER_KEY
  - name: DIM_DATE
    description: The table contains records representing individual calendar dates for use in time-based analysis. Each record includes standard calendar attributes such as day, week, month, quarter, and year designations, along with indicators for weekends and holidays, and corresponding fiscal calendar equivalents.
    base_table:
      database: RETAIL_ANALYTICS
      schema: GOLD
      table: DIM_DATE
    dimensions:
      - name: DAY_OF_MONTH
        description: The numeric day of the month component of a date.
        expr: DAY_OF_MONTH
        data_type: NUMBER(38,0)
        access_modifier: public_access
        sample_values:
          - '3'
          - '2'
          - '1'
      - name: DAY_OF_WEEK
        description: The numeric representation of the day of the week.
        expr: DAY_OF_WEEK
        data_type: NUMBER(38,0)
        access_modifier: public_access
        sample_values:
          - '4'
          - '0'
          - '6'
      - name: DAY_OF_WEEK_NAME
        description: The abbreviated name of the day of the week.
        expr: DAY_OF_WEEK_NAME
        data_type: VARCHAR(10)
        access_modifier: public_access
        sample_values:
          - Thu
          - Sat
          - Fri
      - name: DAY_OF_YEAR
        description: The numeric day of the year ranging from 1 to 366.
        expr: DAY_OF_YEAR
        data_type: NUMBER(38,0)
        access_modifier: public_access
        sample_values:
          - '56'
          - '255'
          - '104'
      - name: FISCAL_MONTH
        description: The fiscal month number within the fiscal year.
        expr: FISCAL_MONTH
        data_type: NUMBER(38,0)
        access_modifier: public_access
        sample_values:
          - '2'
          - '1'
          - '3'
      - name: FISCAL_QUARTER
        description: The fiscal quarter of the financial reporting period.
        expr: FISCAL_QUARTER
        data_type: NUMBER(38,0)
        access_modifier: public_access
        sample_values:
          - '1'
          - '3'
          - '2'
      - name: FISCAL_YEAR
        description: The fiscal year associated with the date record.
        expr: FISCAL_YEAR
        data_type: NUMBER(38,0)
        access_modifier: public_access
        sample_values:
          - '2026'
      - name: HOLIDAY_NAME
        description: The name of the holiday associated with a given date.
        expr: HOLIDAY_NAME
        data_type: VARCHAR(100)
        access_modifier: public_access
      - name: IS_HOLIDAY
        description: Indicates whether the date falls on a public holiday.
        expr: IS_HOLIDAY
        data_type: BOOLEAN
        access_modifier: public_access
        sample_values:
          - 'FALSE'
      - name: IS_WEEKEND
        description: Indicates whether the date falls on a weekend day.
        expr: IS_WEEKEND
        data_type: BOOLEAN
        access_modifier: public_access
        sample_values:
          - 'TRUE'
          - 'FALSE'
      - name: MONTH_NAME
        description: The full name of the month associated with a given date.
        expr: MONTH_NAME
        data_type: VARCHAR(10)
        access_modifier: public_access
        sample_values:
          - Feb
          - Jan
          - Mar
      - name: MONTH_NAME_SHORT
        description: Abbreviated month name.
        expr: MONTH_NAME_SHORT
        data_type: VARCHAR(3)
        access_modifier: public_access
        sample_values:
          - Jan
          - Feb
          - Mar
      - name: MONTH_NUMBER
        description: The numeric representation of the month within a year.
        expr: MONTH_NUMBER
        data_type: NUMBER(38,0)
        access_modifier: public_access
        sample_values:
          - '2'
          - '1'
          - '3'
      - name: QUARTER_NAME
        description: The name of the fiscal or calendar quarter.
        expr: QUARTER_NAME
        data_type: VARCHAR(10)
        access_modifier: public_access
        sample_values:
          - Q1
          - Q3
          - Q2
      - name: QUARTER_NUMBER
        description: The numeric representation of the quarter within a year.
        expr: QUARTER_NUMBER
        data_type: NUMBER(38,0)
        access_modifier: public_access
        sample_values:
          - '1'
          - '2'
          - '3'
      - name: WEEK_OF_YEAR
        description: The week number within a given year.
        expr: WEEK_OF_YEAR
        data_type: NUMBER(38,0)
        access_modifier: public_access
        sample_values:
          - '33'
          - '11'
          - '29'
      - name: YEAR_NUMBER
        description: The calendar year number associated with a given date.
        expr: YEAR_NUMBER
        data_type: NUMBER(38,0)
        access_modifier: public_access
        sample_values:
          - '2026'
    time_dimensions:
      - name: CREATED_AT
        description: The timestamp indicating when the record was created.
        expr: CREATED_AT
        data_type: TIMESTAMP_NTZ(9)
        access_modifier: public_access
        sample_values:
          - '2026-08-15T04:59:23.368Z'
          - '2026-08-15T04:59:42.894Z'
          - '2026-08-15T05:00:09.402Z'
      - name: DATE_KEY
        description: The calendar date used as the primary key for the date dimension.
        expr: DATE_KEY
        data_type: DATE
        access_modifier: public_access
        sample_values:
          - '2026-01-01'
          - '2026-01-03'
          - '2026-01-12'
      - name: FULL_DATE
        description: The full calendar date associated with each record in the date dimension.
        expr: FULL_DATE
        data_type: DATE
        access_modifier: public_access
        sample_values:
          - '2026-05-22'
          - '2026-01-02'
          - '2026-02-26'
    primary_key:
      columns:
        - DATE_KEY
  - name: DIM_PRODUCT
    description: The table contains records of products, serving as a dimension table with details about each product's identity, categorization, and pricing. Each record includes supplier associations, cost and selling price information, profit margin metrics, and price tier classifications, with support for tracking historical changes over time via validity date ranges.
    base_table:
      database: RETAIL_ANALYTICS
      schema: GOLD
      table: DIM_PRODUCT
    dimensions:
      - name: CATEGORY_DESCRIPTION
        description: The descriptive label for the product category.
        expr: CATEGORY_DESCRIPTION
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - Drinks and beverages
          - Packaged snacks and light food
          - Household and cleaning products
      - name: CATEGORY_ID
        description: The unique identifier for a product category.
        expr: CATEGORY_ID
        data_type: NUMBER(38,0)
        access_modifier: public_access
        sample_values:
          - '1'
          - '2'
          - '3'
      - name: CATEGORY_NAME
        description: The name of the product category.
        expr: CATEGORY_NAME
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - Beverages
          - Snacks
          - Household
      - name: IS_CURRENT
        description: Indicates whether the product record is the current active version.
        expr: IS_CURRENT
        data_type: BOOLEAN
        access_modifier: public_access
        sample_values:
          - 'TRUE'
      - name: IS_VALID
        description: Indicates whether a product is considered valid.
        expr: IS_VALID
        data_type: BOOLEAN
        access_modifier: public_access
        sample_values:
          - 'TRUE'
      - name: PRICE_TIER
        description: The pricing tier or category assigned to a product.
        expr: PRICE_TIER
        data_type: VARCHAR(7)
        access_modifier: public_access
        sample_values:
          - Premium
      - name: PRODUCT_BUSINESS_KEY
        description: A unique numeric identifier assigned to each product for business reference purposes.
        expr: PRODUCT_BUSINESS_KEY
        data_type: NUMBER(38,0)
        access_modifier: public_access
        sample_values:
          - '3'
          - '2'
          - '1'
      - name: PRODUCT_KEY
        description: The surrogate key uniquely identifying each product in the dimension table.
        expr: PRODUCT_KEY
        data_type: NUMBER(38,0)
        access_modifier: public_access
        sample_values:
          - '1'
          - '3'
          - '2'
      - name: PRODUCT_NAME
        description: The full name of the product.
        expr: PRODUCT_NAME
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - Coca Cola 330ml
          - Pepsi 330ml
          - Mineral Water 600ml
      - name: SKU
        description: Stock Keeping Unit (SKU) identifier used to uniquely identify each product.
        expr: SKU
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - BEV-002
          - HOU-002
          - BEV-003
      - name: SUPPLIER_ID
        description: The unique identifier assigned to a supplier.
        expr: SUPPLIER_ID
        data_type: NUMBER(38,0)
        access_modifier: public_access
        sample_values:
          - '4'
          - '2'
          - '1'
    time_dimensions:
      - name: PROCESSED_AT
        description: The timestamp indicating when the product record was processed.
        expr: PROCESSED_AT
        data_type: TIMESTAMP_LTZ(9)
        access_modifier: public_access
        sample_values:
          - 2026-08-15T11:52:58.530+0000
      - name: SOURCE_EXTRACTED_AT
        description: The timestamp indicating when the record was extracted from the source system.
        expr: SOURCE_EXTRACTED_AT
        data_type: TIMESTAMP_TZ(9)
        access_modifier: public_access
        sample_values:
          - '2026-08-15T11:27:29.842Z'
      - name: VALID_FROM
        description: The timestamp indicating the start of the period during which the product record is considered valid.
        expr: VALID_FROM
        data_type: TIMESTAMP_LTZ(9)
        access_modifier: public_access
        sample_values:
          - 2026-08-15T11:52:58.530+0000
      - name: VALID_TO
        description: The timestamp indicating when the product record's validity period ends.
        expr: VALID_TO
        data_type: TIMESTAMP_NTZ(9)
        access_modifier: public_access
    facts:
      - name: COST_PRICE
        description: The cost price of a product.
        expr: COST_PRICE
        data_type: FLOAT
        access_modifier: public_access
        sample_values:
          - '2500'
          - '5000'
          - '4800'
      - name: PROFIT_MARGIN
        description: The profit margin of a product measured in monetary units.
        expr: PROFIT_MARGIN
        data_type: FLOAT
        access_modifier: public_access
        sample_values:
          - '2200'
          - '1500'
          - '2500'
      - name: PROFIT_MARGIN_PCT
        description: The profit margin percentage for a product.
        expr: PROFIT_MARGIN_PCT
        data_type: FLOAT
        access_modifier: public_access
        sample_values:
          - '60'
          - '45.833333333'
          - '50'
      - name: SELLING_PRICE
        description: The selling price of a product.
        expr: SELLING_PRICE
        data_type: FLOAT
        access_modifier: public_access
        sample_values:
          - '7500'
          - '4000'
          - '7000'
    primary_key:
      columns:
        - PRODUCT_KEY
  - name: DIM_STORE
    description: The table contains records of retail store locations and their associated attributes. Each record includes details about a store's geographic location, operational timeline, and maturity classification, with support for tracking historical changes over time.
    base_table:
      database: RETAIL_ANALYTICS
      schema: GOLD
      table: DIM_STORE
    dimensions:
      - name: CITY
        description: The city where the store is located.
        expr: CITY
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - Bandung
          - Surabaya
          - Jakarta
      - name: COUNTRY
        description: The country where the store is located.
        expr: COUNTRY
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - INDONESIA
      - name: IS_CURRENT
        description: Indicates whether the store record is the current active version.
        expr: IS_CURRENT
        data_type: BOOLEAN
        access_modifier: public_access
        sample_values:
          - 'TRUE'
      - name: IS_VALID
        description: Indicates whether the store record is considered valid.
        expr: IS_VALID
        data_type: BOOLEAN
        access_modifier: public_access
        sample_values:
          - 'TRUE'
      - name: STATE
        description: The state or province where the store is located.
        expr: STATE
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - EAST JAVA
          - WEST JAVA
          - DKI JAKARTA
      - name: STORE_AGE_YEARS
        description: The age of the store measured in years.
        expr: STORE_AGE_YEARS
        data_type: NUMBER(9,0)
        access_modifier: public_access
        sample_values:
          - '4'
          - '3'
          - '5'
      - name: STORE_BUSINESS_KEY
        description: The unique business identifier assigned to each store.
        expr: STORE_BUSINESS_KEY
        data_type: NUMBER(38,0)
        access_modifier: public_access
        sample_values:
          - '2'
          - '3'
          - '4'
      - name: STORE_KEY
        description: The surrogate key uniquely identifying each store record.
        expr: STORE_KEY
        data_type: NUMBER(38,0)
        access_modifier: public_access
        sample_values:
          - '3'
          - '1'
          - '2'
      - name: STORE_MATURITY
        description: The maturity or lifecycle stage of a store.
        expr: STORE_MATURITY
        data_type: VARCHAR(11)
        access_modifier: public_access
        sample_values:
          - Mature
          - Established
      - name: STORE_NAME
        description: The name of the retail store.
        expr: STORE_NAME
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - Jakarta Mall
          - Surabaya Plaza
          - Bandung Central
    time_dimensions:
      - name: OPENED_DATE
        description: The date on which the store was opened.
        expr: OPENED_DATE
        data_type: DATE
        access_modifier: public_access
        sample_values:
          - '2022-01-15'
          - '2024-01-05'
          - '2023-03-10'
      - name: PROCESSED_AT
        description: The timestamp indicating when the store record was processed.
        expr: PROCESSED_AT
        data_type: TIMESTAMP_LTZ(9)
        access_modifier: public_access
        sample_values:
          - 2026-08-15T11:53:00.132+0000
      - name: SOURCE_EXTRACTED_AT
        description: The timestamp indicating when the record was extracted from the source system.
        expr: SOURCE_EXTRACTED_AT
        data_type: TIMESTAMP_TZ(9)
        access_modifier: public_access
        sample_values:
          - '2026-08-15T11:27:29.841Z'
      - name: VALID_FROM
        description: The timestamp indicating the start of the period during which the store record is considered valid.
        expr: VALID_FROM
        data_type: TIMESTAMP_LTZ(9)
        access_modifier: public_access
        sample_values:
          - 2026-08-15T11:53:00.132+0000
      - name: VALID_TO
        description: The timestamp indicating when the store dimension record's validity period ends.
        expr: VALID_TO
        data_type: TIMESTAMP_NTZ(9)
        access_modifier: public_access
    primary_key:
      columns:
        - STORE_KEY
